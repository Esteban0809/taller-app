services:

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: taller_app
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: taller
      MYSQL_PASSWORD: taller
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: taller
      DB_PASSWORD: taller
      DB_NAME: taller_app
      JWT_SECRET: development-only-change-in-production-01234567890123456789
    ports:
      - "8000:8000"

volumes:
  mysql_data:
